name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 校验 16:9 demo（越界 / 文字溢出）
        run: npm run check

      - name: 校验 4:3 demo
        run: node bin/slideforge.js check examples/demo.deck.yaml --aspect 4:3

      - name: 生成两种比例的 PPTX 与 HTML
        run: |
          npm run demo
          node bin/slideforge.js build examples/demo.deck.yaml --aspect 4:3

      - name: 确认产物非空
        run: |
          for f in out/*.pptx out/*.html; do
            test -s "$f" || { echo "产物为空: $f"; exit 1; }
            ls -lh "$f"
          done

      - name: 校验技能包可打包且引擎自包含
        run: |
          npm run pack:skill
          test -s dist/slide-forge.zip || { echo "技能包为空"; exit 1; }
          test -f dist/slide-forge/SKILL.md || { echo "缺少 SKILL.md"; exit 1; }
          # 用内嵌引擎在空目录跑一次，确认不依赖仓库根目录
          mkdir -p .smoke && cp skills/slide-forge/assets/deck-skeleton.yaml .smoke/deck.yaml
          node dist/slide-forge/engine/bin/slideforge.js check .smoke/deck.yaml
          node dist/slide-forge/engine/bin/slideforge.js build .smoke/deck.yaml
          ls -lh dist/slide-forge.zip

      - name: 上传技能包
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: slide-forge-skill
          path: dist/slide-forge.zip
          if-no-files-found: error

      - name: 上传 demo 产物
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: slide-forge-demo
          path: |
            out/*.pptx
            out/*.html
          if-no-files-found: error
